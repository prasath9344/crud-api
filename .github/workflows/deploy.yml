
name: Deploy PrepyAI-API Docker App to AWS EC2

on:
  workflow_dispatch:
    inputs:
      name:
        description: "Deploy the PrepyAI-API from Dev"
        default: "dev"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: crud-api
  CONTAINER_NAME: crud-api
  INSTANCE_TYPE: t2.micro
  AMI_ID: ami-0c398cb65a93047f2
  KEY_NAME: crud-api-ec2.key.pem
  INSTANCE_NAME: crud-api-instance
  SECURITY_GROUP_NAME: ec2-rds-2
  SECURITY_GROUP_DESCRIPTION: "launch-wizard-1 created via GitHub Actions"
  VPC_ID: vpc-053cc851f75c76519
  ECR_ROLE_NAME: crud-api-dep
  EIP_ALLOCATION_ID: eipalloc-093a6205a5a73e4d4

jobs:
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq
      # Remove any line that installs awscli here!

      # If you need a newer AWS CLI version for specific features:
      - name: Update AWS CLI (optional)
        run: |
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip awscliv2.zip
          sudo ./aws/install --update


      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          audience: sts.amazonaws.com
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::575327645493:role/crud-api-dep 

      - name: Get security group id (safe)
        id: sg
        run: |
          SG_ID=$(aws ec2 describe-security-groups --filters "Name=group-name,Values=${{ env.SECURITY_GROUP_NAME }}" --query 'SecurityGroups[0].GroupId' --output text 2>/dev/null || echo "None")
          echo "security_group_id=$SG_ID" >> $GITHUB_ENV
          if [ "$SG_ID" = "None" ]; then
            echo "security_group_exists=false" >> $GITHUB_ENV
          else
            echo "security_group_exists=true" >> $GITHUB_ENV
          fi

      - name: Create Security Group
        if: env.security_group_exists == 'false'
        run: |
          SG_ID=$(aws ec2 create-security-group \
            --group-name ${{ env.SECURITY_GROUP_NAME }} \
            --description "${{ env.SECURITY_GROUP_DESCRIPTION }}" \
            --vpc-id ${{ env.VPC_ID }} \
            --query 'GroupId' --output text)
          echo "security_group_id=$SG_ID" >> $GITHUB_ENV

      - name: Authorize Security Group Ingress Rules
        run: |
          SG_ID=${{ env.security_group_id }}
          RULES='[
              {"IpProtocol":"tcp","FromPort":22,"ToPort":22,"CidrIp":"0.0.0.0/0"},
              {"IpProtocol":"tcp","FromPort":80,"ToPort":80,"CidrIp":"0.0.0.0/0"},
              {"IpProtocol":"tcp","FromPort":443,"ToPort":443,"CidrIp":"0.0.0.0/0"},
              {"IpProtocol":"tcp","FromPort":5000,"ToPort":5000,"CidrIp":"0.0.0.0/0"}
            ]'
          for RULE in $(echo "$RULES" | jq -c '.[]'); do
            PROTOCOL=$(echo "$RULE" | jq -r '.IpProtocol')
            FROM_PORT=$(echo "$RULE" | jq -r '.FromPort')
            TO_PORT=$(echo "$RULE" | jq -r '.ToPort')
            CIDR_IP=$(echo "$RULE" | jq -r '.CidrIp')
            EXISTING_RULE=$(aws ec2 describe-security-group-rules \
              --filters Name=group-id,Values=$SG_ID \
              --query "SecurityGroupRules[?FromPort==\`$FROM_PORT\` && ToPort==\`$TO_PORT\` && IpProtocol==\`$PROTOCOL\` && CidrIpv4==\`$CIDR_IP\` ]" \
              --output text)
            if [ -z "$EXISTING_RULE" ]; then
              aws ec2 authorize-security-group-ingress \
                --group-id $SG_ID \
                --protocol $PROTOCOL \
                --port $FROM_PORT-$TO_PORT \
                --cidr $CIDR_IP || true
            fi
          done

      - name: Check if EC2 Instance Exists
        id: check-instance
        run: |
          INST_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=${{ env.INSTANCE_NAME }}" "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' --output text 2>/dev/null || echo "None")
          echo "instance_id=$INST_ID" >> $GITHUB_ENV
          if [ "$INST_ID" = "None" ]; then
            echo "instance_exists=false" >> $GITHUB_ENV
          else
            echo "instance_exists=true" >> $GITHUB_ENV
          fi

      - name: Create EC2 Instance (if not exists)
        if: env.instance_exists == 'false'
        run: |
          SG_ID=${{ env.security_group_id }}
          INSTANCE_ID=$(aws ec2 run-instances \
            --image-id ${{ env.AMI_ID }} \
            --count 1 \
            --instance-type ${{ env.INSTANCE_TYPE }} \
            --key-name ${{ env.KEY_NAME }} \
            --network-interfaces "[{'AssociatePublicIpAddress':true,'DeviceIndex':0,'Groups':['${SG_ID}']}]" \
            --iam-instance-profile Name=${{ env.ECR_ROLE_NAME }} \
            --tag-specifications "ResourceType=instance,Tags=[{Key=Name,Value=${{ env.INSTANCE_NAME }}}]" \
            --query 'Instances[0].InstanceId' --output text)
          echo "instance_id=$INSTANCE_ID" >> $GITHUB_ENV

      - name: Wait for EC2 Instance to be Running
        run: |
          aws ec2 wait instance-running --instance-ids ${{ env.instance_id }}

      - name: Get Public IP of EC2 Instance
        run: |
          IP=$(aws ec2 describe-instances --instance-ids ${{ env.instance_id }} --query 'Reservations[0].Instances[0].PublicIpAddress' --output text)
          echo "public_ip=$IP" >> $GITHUB_ENV

        run: |
         set -e
         aws ec2 associate-address --instance-id i-099e6f3e0fbdfa0ae --allocation-id eipalloc-093a6205a5a73e4d4 || true


      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG .
          docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG

      - name: Get SSH Key
        run: |
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > private_key.pem
          chmod 600 private_key.pem

      - name: Remote setup - Install, configure and deploy
        env:
          IMAGE_TAG: ${{ github.sha }}
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          AWS_REGION: ${{ env.AWS_REGION }}
        run: |
          PUBLIC_IP=${{ env.public_ip }}
          ssh -o StrictHostKeyChecking=no -i private_key.pem ubuntu@${PUBLIC_IP} << 'EOF'
            set -e
            sudo apt-get update -y
            sudo apt-get install -y nginx docker.io jq awscli certbot python3-certbot-nginx
            curl -fsSL https://get.docker.com -o get-docker.sh
            sudo sh get-docker.sh
            sudo usermod -aG docker ubuntu
            sudo systemctl enable docker --now || true

            sudo aws ecr get-login-password --region '${{ env.AWS_REGION }}' | sudo docker login --username AWS --password-stdin '${{ steps.login-ecr.outputs.registry }}'
            sudo docker pull '${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}'
            echo -e "DB_USER=${{ secrets.DB_USER }}\nDB_HOST=${{ secrets.DB_HOST }}\nDB_NAME=${{ secrets.DB_NAME }}\nDB_PASSWORD=${{ secrets.DB_PASSWORD }}" | sudo tee /home/ubuntu/.env
            sudo chown ubuntu:ubuntu /home/ubuntu/.env

            sudo bash -c 'cat > /etc/systemd/system/${{ env.CONTAINER_NAME }}.service <<SERVICE

      - name: Setup and Configure Services
        run: |
          sudo aws ecr get-login-password --region '${{ env.AWS_REGION }}' | sudo docker login --username AWS --password-stdin '${{ steps.login-ecr.outputs.registry }}'
          sudo docker pull '${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}'
          echo -e "DB_USER=${{ secrets.DB_USER }}\nDB_HOST=${{ secrets.DB_HOST }}\nDB_NAME=${{ secrets.DB_NAME }}\nDB_PASSWORD=${{ secrets.DB_PASSWORD }}" | sudo tee /home/ubuntu/.env
          sudo chown ubuntu:ubuntu /home/ubuntu/.env

          # Create systemd service
          sudo bash -c "cat > /etc/systemd/system/${{ env.CONTAINER_NAME }}.service <<'SERVICE'
          [Unit]
          Description=Crud Container
          After=network.target docker.service
          Requires=docker.service

          [Service]
          Restart=always
          ExecStartPre=-/usr/bin/docker stop crud-api
          ExecStartPre=-/usr/bin/docker rm crud-api
          ExecStart=/usr/bin/docker run --name crud-api --env-file /home/ubuntu/.env -p 5000:5000 ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          ExecStop=/usr/bin/docker stop crud-api

          [Install]
          WantedBy=multi-user.target
          SERVICE"

          sudo systemctl daemon-reload
          sudo systemctl enable ${{ env.CONTAINER_NAME }}
          sudo systemctl restart ${{ env.CONTAINER_NAME }}

          # Create Nginx config
          sudo bash -c "cat > /etc/nginx/sites-available/${{ env.CONTAINER_NAME }} <<'NGCONF'
          server {
          listen 80;
          server_name prasathcrudapi.live;

          location / {
              proxy_pass http://localhost:5000;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
          }
          }
          NGCONF"

          sudo rm -f /etc/nginx/sites-enabled/default || true
          sudo ln -sf /etc/nginx/sites-available/${{ env.CONTAINER_NAME }} /etc/nginx/sites-enabled/
          sudo nginx -t && sudo systemctl restart nginx

          # Request Let's Encrypt SSL Certificate
          sudo certbot --nginx -d prasathcrudapi.live --non-interactive --agree-tos -m engineering@adraproductstudio.com
