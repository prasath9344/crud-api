name: Deploy PrepyAI-API Docker App to AWS EC2

on:
  workflow_dispatch:
    inputs:
      name:
        description: "Deploy the PrepyAI-API from Dev"
        default: "dev"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: crud-api
  CONTAINER_NAME: crud-api
  INSTANCE_TYPE: t2.micro
  AMI_ID: ami-0c398cb65a93047f2
  KEY_NAME: crud-api-ec2.key.pem
  INSTANCE_NAME: crud-api-instance
  SECURITY_GROUP_NAME: ec2-rds-1
  SECURITY_GROUP_DESCRIPTION: "launch-wizard-1 created via GitHub Actions"
  VPC_ID: vpc-053cc851f75c76519
  ECR_ROLE_NAME: crud-api-new

jobs:
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          audience: sts.amazonaws.com
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::575327645493:role/crud-api-new

      # ---------- SECURITY GROUP ----------
      - name: Get security group id
        run: |
          SECURITY_GROUP_ID=$(aws ec2 describe-security-groups \
              --group-names ${{env.SECURITY_GROUP_NAME}} \
              --query 'SecurityGroups[0].GroupId' \
              --output text)
          echo "Security Group ID is $SECURITY_GROUP_ID"

          if [ "$SECURITY_GROUP_ID" == "None" ]; then
            echo "security_group_exists=false" >> $GITHUB_ENV
          else
            echo "security_group_exists=true" >> $GITHUB_ENV
            echo "security_group_id=$SECURITY_GROUP_ID" >> $GITHUB_ENV
          fi

      - name: Create Security Group
        if: env.security_group_exists == 'false'
        run: |
          SECURITY_GROUP_ID=$(aws ec2 create-security-group \
            --group-name ${{ env.SECURITY_GROUP_NAME }} \
            --description "${{ env.SECURITY_GROUP_DESCRIPTION }}" \
            --vpc-id ${{ env.VPC_ID }} \
            --query 'GroupId' \
            --output text)
          echo "security_group_id=$SECURITY_GROUP_ID" >> $GITHUB_ENV

      - name: Authorize Security Group Ingress Rules
        run: |
          RULES='[
            {"IpProtocol":"tcp","FromPort":22,"ToPort":22,"CidrIp":"0.0.0.0/0"},
            {"IpProtocol":"tcp","FromPort":80,"ToPort":80,"CidrIp":"0.0.0.0/0"},
            {"IpProtocol":"tcp","FromPort":443,"ToPort":443,"CidrIp":"0.0.0.0/0"},
            {"IpProtocol":"tcp","FromPort":5000,"ToPort":5000,"CidrIp":"0.0.0.0/0"}
          ]'
          for RULE in $(echo "$RULES" | jq -c '.[]'); do
            PROTOCOL=$(echo "$RULE" | jq -r '.IpProtocol')
            FROM_PORT=$(echo "$RULE" | jq -r '.FromPort')
            TO_PORT=$(echo "$RULE" | jq -r '.ToPort')
            CIDR_IP=$(echo "$RULE" | jq -r '.CidrIp')

            EXISTING_RULE=$(aws ec2 describe-security-group-rules \
              --filters Name=group-id,Values=${{ env.security_group_id }} \
              --query 'SecurityGroupRules[?FromPort==`'$FROM_PORT'` && ToPort==`'$TO_PORT'` && IpProtocol==`'$PROTOCOL'` && CidrIpv4==`'$CIDR_IP'`]' \
              --output text)

            if [ "$EXISTING_RULE" == "" ]; then
              aws ec2 authorize-security-group-ingress \
                --group-id ${{ env.security_group_id }} \
                --protocol $PROTOCOL \
                --port $FROM_PORT-$TO_PORT \
                --cidr $CIDR_IP
            fi
          done

      # ---------- EC2 INSTANCE ----------
      - name: Check if EC2 Instance Exists
        id: check-instance
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=${{ env.INSTANCE_NAME }}" "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' \
            --output text)

          if [ "$INSTANCE_ID" == "None" ]; then
            echo "instance_exists=false" >> $GITHUB_ENV
          else
            echo "instance_exists=true" >> $GITHUB_ENV
            echo "instance_id=$INSTANCE_ID" >> $GITHUB_ENV
          fi

      - name: Create EC2 Instance (if not exists)
        if: env.instance_exists == 'false'
        run: |
          INSTANCE_ID=$(aws ec2 run-instances \
            --image-id ${{ env.AMI_ID }} \
            --count 1 \
            --instance-type ${{ env.INSTANCE_TYPE }} \
            --key-name ${{ env.KEY_NAME }} \
            --network-interfaces '[{"AssociatePublicIpAddress":true,"DeviceIndex":0,"Groups":["${{ env.security_group_id }}"]}]' \
            --iam-instance-profile Name=${{ env.ECR_ROLE_NAME }} \
            --tag-specifications 'ResourceType=instance,Tags=[{Key=Name,Value=${{ env.INSTANCE_NAME }}}]' \
            --query 'Instances[0].InstanceId' \
            --output text)
          echo "instance_id=$INSTANCE_ID" >> $GITHUB_ENV

      - name: Wait for EC2 Instance to be Running
        run: aws ec2 wait instance-running --instance-ids ${{ env.instance_id }}

      - name: Get Public IP of EC2 Instance
        id: get-ip
        run: |
          PUBLIC_IP=$(aws ec2 describe-instances \
            --instance-ids ${{ env.instance_id }} \
            --query 'Reservations[0].Instances[0].PublicIpAddress' \
            --output text)
          echo "public_ip=$PUBLIC_IP" >> $GITHUB_ENV

      # ---------- ECR & DEPLOY ----------
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Get SSH Key
        run: |
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > private_key.pem
          chmod 600 private_key.pem

      - name: Deploy to EC2
        run: |
          IMAGE_TAG="${{ github.sha }}"
          ssh -o StrictHostKeyChecking=no -i private_key.pem ubuntu@${{ env.public_ip }} << 'EOF'
            sudo apt-get update -y
            sudo apt-get install -y gnupg ca-certificates curl unzip lsb-release nginx certbot python3-certbot-nginx
            sudo curl -fsSL https://get.docker.com -o get-docker.sh
            sudo sh get-docker.sh
            sudo usermod -aG docker ubuntu
            sudo systemctl enable docker --now

            aws ecr get-login-password --region us-east-1 | sudo docker login --username AWS --password-stdin ${{ steps.login-ecr.outputs.registry }}
            sudo docker pull ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${IMAGE_TAG}

            echo "DB_USER=${{ secrets.DB_USER }}" | sudo tee /home/ubuntu/.env
            echo "DB_HOST=${{ secrets.DB_HOST }}" | sudo tee -a /home/ubuntu/.env
            echo "DB_NAME=${{ secrets.DB_NAME }}" | sudo tee -a /home/ubuntu/.env
            echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" | sudo tee -a /home/ubuntu/.env

            sudo tee /etc/systemd/system/${{ env.CONTAINER_NAME }}.service > /dev/null << SERVICE
